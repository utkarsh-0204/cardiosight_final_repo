services:
  # ---------------------------------------------------------------------------
  # 1. Frontend: Angular Single Page Application
  # ---------------------------------------------------------------------------
  - type: web
    name: cardiosight-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/cardiosight/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  # ---------------------------------------------------------------------------
  # 2. Backend Gateway: Node.js / Express API
  # ---------------------------------------------------------------------------
  - type: web
    name: cardiosight-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cardiosight-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://cardiosight.in,https://www.cardiosight.in,https://cardiosight-frontend.onrender.com
      - key: ML_SERVER_URL
        fromService:
          type: web
          name: cardiosight-ml
          property: host

  # ---------------------------------------------------------------------------
  # 3. ML Inference Service: Django / scikit-learn / shap
  # ---------------------------------------------------------------------------
  - type: web
    name: cardiosight-ml
    runtime: python
    plan: free
    rootDir: ML
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn cardiosight_ml.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"

# -----------------------------------------------------------------------------
# 4. PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: cardiosight-db
    plan: free
    databaseName: cardiosight
    user: cardiosight

